version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: backup_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    container_name: backup_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  silo:
    image: pgsty/silo:latest
    container_name: backup_silo
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_S3_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - silo_data:/data

  server:
    image: backupmanager-server:local
    container_name: backupmanager_server

    build:
      context: ./backupmanager-server
      dockerfile: Dockerfile

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL:  jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      STORAGE_S3_ENDPOINT: http://silo:9000
      STORAGE_S3_BUCKET_NAME: ${STORAGE_S3_BUCKET_NAME}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION}
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY}
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY}

      API_SECURITY_TOKEN_ACCESS_EXPIRATION: ${API_SECURITY_TOKEN_ACCESS_EXPIRATION}
      API_SECURITY_TOKEN_REFRESH_EXPIRATION: ${API_SECURITY_TOKEN_REFRESH_EXPIRATION}
      JWT_SECRET: ${JWT_SECRET}


volumes:
  postgres_data:
  silo_data:
  redis_data:
