spring:
  application:
    name: backupmanager-server

  datasource:
    url: jdbc:postgresql://localhost:5432/backup_manager
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

storage:
  s3:
    endpoint: http://localhost:9000
    bucket-name: erp-backups-bucket
    region: us-east-1
    access-key: minioadmin
    secret-key: minioadmin

api:
  security:
    token:
      access-expiration: 7200000
      refresh-expiration: 604800000
      secret: ${JWT_SECRET:3JdrC5d9HauTsAb33spoS6EzSuGCtNS274rQ7V4B5pQ=}