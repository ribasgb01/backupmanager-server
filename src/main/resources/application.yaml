spring:
  application:
    name: backupmanager-server

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

storage:
  s3:
    endpoint: ${STORAGE_S3_ENDPOINT}
    bucket-name: ${STORAGE_S3_BUCKET_NAME}
    region: ${STORAGE_S3_REGION}
    access-key: ${STORAGE_S3_ACCESS_KEY}
    secret-key: ${STORAGE_S3_SECRET_KEY}

api:
  security:
    token:
      access-expiration: ${API_SECURITY_TOKEN_ACCESS_EXPIRATION:900000}
      refresh-expiration: ${API_SECURITY_TOKEN_REFRESH_EXPIRATION:604800000}
      secret: ${JWT_SECRET}
